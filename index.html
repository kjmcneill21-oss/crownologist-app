<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crown.ologist Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT@9..144,700..900,100&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C8124F; --pink-deep:#A40E40; --blush:#FBE3EA; --forest:#0E3B2E; --cream:#FBF5EA; --paper:#FFFDF8;
  --line:#E3D5BA; --gold:#A87C2E; --ink:#12261D; --muted:#4D5B53;
  --danger:#A8221B; --danger-bg:#FCE4E2; --ok:#1A5E40; --ok-bg:#E1F1E8; --info-bg:#DCE6DD;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mark:"Fraunces",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --cream:#0F1F19; --paper:#16291F; --line:#2E4A3B; --ink:#F6EFE2; --muted:#C2CEC6; --blush:#3A1B27; --danger-bg:#3D1715; --danger:#FFA59C; --ok-bg:#163A2A; --ok:#97DDB7; --info-bg:#29443A; } }
:root[data-theme="dark"]{ --cream:#0F1F19; --paper:#16291F; --line:#2E4A3B; --ink:#F6EFE2; --muted:#C2CEC6; --blush:#3A1B27; --danger-bg:#3D1715; --danger:#FFA59C; --ok-bg:#163A2A; --ok:#97DDB7; --info-bg:#29443A; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
main:focus{outline:none}
#app{max-width:560px;margin:0 auto;min-height:100vh}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- brand page (sign-in) : real florals behind the striped backdrop, always on cream ---------- */
.page{position:relative;overflow:hidden;background:#FBF5EA;color:#12261D;min-height:100vh;display:flex;flex-direction:column}
.fl{position:absolute;pointer-events:none;user-select:none;z-index:1}
.backdrop{position:relative;z-index:2;margin:96px 22px 0;border-radius:28px;padding:32px 20px 26px;text-align:center;
  background:repeating-linear-gradient(90deg,#0E3B2E 0 26px,#0B3428 26px 52px);box-shadow:0 18px 40px rgba(14,59,46,.28)}
.wordmark{font-family:var(--mark);font-variation-settings:"SOFT" 100;font-weight:850;letter-spacing:-.02em;line-height:.88}
.backdrop .wordmark{color:#F49AC0;font-size:56px}
.academy{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;color:#F49AC0;font-weight:600;font-size:14px;letter-spacing:.46em;text-indent:.46em}
.academy i{font-style:normal;font-size:12px;letter-spacing:0;text-indent:0}
.sequin{height:28px;margin-top:auto;position:relative;z-index:2;
  background:radial-gradient(circle,#F6D98B 0 3px,#C9952F 4px 7px,transparent 8px) 0 0/16px 16px,
             radial-gradient(circle,#FBE7A9 0 2px,#B8862A 3px 7px,transparent 8px) 8px 8px/16px 16px,#7A5512}

.card{position:relative;z-index:2;margin:22px 18px 30px;background:#FFFDF8;border:1px solid #E3D5BA;border-radius:26px;padding:20px 18px 22px;box-shadow:0 10px 30px rgba(14,59,46,.08);color:#12261D}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#FBF5EA;border:1px solid #E3D5BA;border-radius:16px;padding:5px;gap:5px;margin-bottom:18px}
.tabs button{min-height:50px;border:0;border-radius:12px;background:transparent;cursor:pointer;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:#4D5B53}
.tabs button[aria-selected="true"]{background:#0E3B2E;color:#FBF5EA}
.card h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:30px;line-height:1;margin:0 0 6px;color:#0E3B2E}
.card .lead{margin:0 0 16px;color:#4D5B53;font-size:16.5px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:16px;margin-bottom:6px}
.field .opt{font-weight:400;color:#4D5B53}
.input{width:100%;min-height:56px;border-radius:14px;border:2px solid #E3D5BA;background:#fff;color:#12261D;padding:12px 14px;font-size:18px}
.input:focus{border-color:#A87C2E;outline:none}
.input[aria-invalid="true"]{border-color:#A8221B}
.pw{position:relative}
.pw .input{padding-right:84px}
.pw button{position:absolute;right:6px;top:6px;height:44px;min-width:70px;border-radius:10px;border:0;background:#FBF5EA;color:#0E3B2E;font-weight:600;font-size:15px;cursor:pointer}
.hint{font-size:14.5px;color:#4D5B53;margin-top:6px}
.err{font-size:15px;color:#A8221B;margin-top:6px;font-weight:600}
.link{background:none;border:0;padding:6px 0;min-height:44px;color:#C8124F;font-weight:600;font-size:16px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.center{text-align:center}

.btn{appearance:none;border:0;border-radius:18px;min-height:60px;padding:8px 22px;width:100%;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;line-height:1.05;text-align:center}
.btn:active{transform:scale(.98)}
.btn-pink{background:#C8124F;color:#fff}
.btn-pink:hover{background:#A40E40}
.btn-ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:2px solid transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.notice{border-radius:16px;padding:14px 16px;font-size:16px;margin-bottom:14px}
.notice b{display:block}
.n-bad{background:#FCE4E2;color:#A8221B}
.n-ok{background:#E1F1E8;color:#1A5E40}
.n-info{background:#DCE6DD;color:#12261D}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;flex:none}
.spin.big{width:44px;height:44px;border-width:4px;border-color:#EBD9B4;border-top-color:#C8124F;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.spin{animation:rot .9s linear infinite}}
@keyframes rot{to{transform:rotate(360deg)}}
.preview-note{position:relative;z-index:3;margin:-12px auto 22px;max-width:300px;padding:8px 12px;border-radius:12px;background:rgba(251,245,234,.94);font-size:13.5px;color:#4D5B53;text-align:center}

/* ---------- home ---------- */
.homehead{position:relative;overflow:hidden;background:#FBF5EA;color:#12261D;padding:18px 18px 22px;border-bottom:1px solid #E3D5BA}
.homehead .top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px}
.homehead .wordmark{color:#C8124F;font-size:26px}
.homehead .wordmark small{display:block;font-family:var(--body);font-weight:600;font-size:.34em;letter-spacing:.42em;color:#0E3B2E;margin-top:.45em}
.acct{min-height:48px;border-radius:24px;border:2px solid #E3D5BA;background:#FFFDF8;color:#12261D;padding:0 14px 0 6px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:16px;cursor:pointer}
.acct .av{width:36px;height:36px;border-radius:50%;background:#C8124F;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.hello{position:relative;z-index:2;margin-top:26px;max-width:70%}
.hello p{margin:0;color:#4D5B53;font-size:16.5px}
.hello h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:42px;line-height:.98;margin:2px 0 0;color:#0E3B2E}
.wrap{padding:20px 16px 40px}
.wrap>*+*{margin-top:16px}
.hero-act{display:block;width:100%;text-align:left;border:0;cursor:pointer;border-radius:26px;padding:22px 20px;color:#FBF5EA;position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg,#0E3B2E 0 22px,#0B3428 22px 44px)}
.hero-act .t{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:32px;line-height:1;color:#F49AC0}
.hero-act .s{display:block;margin-top:6px;font-size:16.5px;color:#E6EDE8;max-width:22ch}
.hero-act .go{position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:#C8124F;display:grid;place-items:center}
.hero-act .go svg{width:26px;height:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:132px;border-radius:22px;border:1px solid var(--line);background:var(--paper);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
.tile .ic{width:46px;height:46px;border-radius:14px;background:var(--blush);color:var(--pink);display:grid;place-items:center}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:19px;display:block;margin-top:12px}
.tile span{font-size:14.5px;color:var(--muted)}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:26px;margin:0;color:var(--ink)}

/* ---------- AI analysis ---------- */
.drop{display:grid;place-items:center;text-align:center;min-height:250px;border:2.5px dashed var(--gold);border-radius:24px;background:var(--paper);padding:24px;gap:12px}
.drop .big{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:26px;color:var(--ink)}
.drop p{margin:0;color:var(--muted);font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.shot{border-radius:24px;overflow:hidden;background:#0B1A14;position:relative}
.shot img{width:100%;max-height:420px;object-fit:contain;display:block}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:5px}
.seg2 button{min-height:52px;border:0;border-radius:12px;background:transparent;cursor:pointer;font-weight:600;font-size:16.5px;color:var(--muted)}
.seg2 button[aria-checked="true"]{background:#0E3B2E;color:#FBF5EA}
.lab{display:block;font-weight:600;font-size:16px;margin-bottom:6px}
textarea.input{font-family:var(--body);line-height:1.45;min-height:96px;resize:vertical;background:var(--paper);color:var(--ink);border-color:var(--line)}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px}
.rcard>*+*{margin-top:10px}
.rcard h3{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:22px;margin:0;color:var(--ink)}
.q{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.q-good{background:var(--ok-bg);color:var(--ok)} .q-fair{background:#FFF0D2;color:#7A4700} .q-poor{background:var(--danger-bg);color:var(--danger)}
.obs{list-style:none;margin:0;padding:0}
.obs li{padding:12px 0;border-top:1px solid var(--line)}
.obs li:first-child{border-top:0;padding-top:4px}
.obs b{display:block;font-size:17px}
.obs span{color:var(--muted);font-size:16px}
.bul{margin:0;padding-left:20px}
.bul li+li{margin-top:6px}
.refer{border-radius:18px;padding:16px;background:#FCE4E2;color:#A8221B}
.refer b{display:block;font-size:17px}
.summary{background:var(--blush);border-radius:16px;padding:14px 16px;font-size:17px}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.thinking{text-align:center;padding:36px 10px}
.thinking p{color:var(--muted)}

.list{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;min-height:72px;color:var(--ink)}
.li:last-child{border-bottom:0}
.li .s{font-size:15px;color:var(--muted)}
.chev{width:20px;height:20px;flex:none;opacity:.55}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--blush);color:var(--pink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none}
.wrap .input,.wrap textarea.input{background:var(--paper);color:var(--ink);border-color:var(--line)}
.wrap .field label{color:var(--ink)} .wrap .hint{color:var(--muted)}
.toggle-row{width:100%;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;cursor:pointer;margin-bottom:14px}
.toggle-row[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.is-disabled{opacity:.5}
select.input{appearance:none;background:var(--paper);color:var(--ink);border-color:var(--line)}
.pdots{display:flex;justify-content:space-between;gap:4px}
.pdot{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);background:var(--paper);font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);cursor:pointer;padding:0}
.pdot.done{background:#0E3B2E;border-color:#D7AE5E;color:#FBF5EA}
.pdot.cur{border-color:#C8124F;box-shadow:0 0 0 4px var(--blush);color:#C8124F}
.pdot.done.cur{color:#FBF5EA}
.pnum{width:40px;height:40px;border-radius:50%;background:#C8124F;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:21px;flex:none}
.lens{position:relative;width:min(86%,320px);aspect-ratio:1/1;margin:14px auto;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#22352C 0%,#0B1A14 70%);
  box-shadow:0 0 0 6px #FBF5EA,0 0 0 9px #D7AE5E,0 0 0 11px #FBF5EA,0 0 0 12.5px #E3D5BA,0 18px 34px rgba(14,59,46,.25)}
.lens img{width:100%;height:100%;object-fit:cover;display:block}
.lens-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#E6EDE8;font-size:15.5px;gap:4px}
.lens-empty span{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;color:#F49AC0;letter-spacing:.02em}
.lens-badge{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);min-width:38px;height:38px;padding:0 10px;border-radius:19px;background:#C8124F;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 0 0 3px #FBF5EA}
.pframe{position:relative;width:min(80%,300px);aspect-ratio:3/4;margin:14px auto;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#22352C 0%,#0B1A14 75%);
  box-shadow:0 0 0 6px #FBF5EA,0 0 0 9px #D7AE5E,0 0 0 11px #FBF5EA,0 0 0 12.5px #E3D5BA,0 18px 34px rgba(14,59,46,.25)}
.pframe img{width:100%;height:100%;object-fit:cover;display:block}
.lens.live video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.reticle{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.live-tag{position:absolute;top:9%;left:50%;transform:translateX(-50%);background:rgba(200,18,79,.92);color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.08em;padding:3px 10px;border-radius:999px}
.shutter{display:block;margin:4px auto 0;width:84px;height:84px;border-radius:50%;border:5px solid #D7AE5E;background:#FBF5EA;padding:6px;cursor:pointer}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#C8124F}
.shutter:active span{transform:scale(.92)}
.lens.sm{width:78px;flex:none;box-shadow:0 0 0 3px #FBF5EA,0 0 0 5px #D7AE5E}
.lens.sm .lens-badge{min-width:24px;height:24px;font-size:14px;bottom:4%;box-shadow:0 0 0 2px #FBF5EA}
.mapwrap{background:linear-gradient(#FFFDF8,#FBF5EA);border:1px solid #E3D5BA;border-radius:20px;padding:10px 8px 6px;margin-top:12px}
.mapsvg{width:100%;max-height:270px;display:block}
.mapsvg.tap{cursor:crosshair;touch-action:manipulation}
@media (prefers-reduced-motion:no-preference){.mpulse{animation:mp 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes mp{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.6);opacity:0}}
.maphint{margin:2px 0 4px;text-align:center;color:#4D5B53;font-size:15px;font-weight:600}
.seg3v{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#FBF5EA;border-radius:12px;padding:4px;margin-bottom:4px}
.seg3v button{min-height:44px;border:0;border-radius:9px;background:transparent;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:#4D5B53;cursor:pointer}
.seg3v button[aria-selected="true"]{background:#0E3B2E;color:#FBF5EA}
.att-row{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.att-row img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
.panel-d{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.panel-d summary{font-weight:600;cursor:pointer;min-height:30px}
.sent-check{width:64px;height:64px;border-radius:50%;background:#0E3B2E;color:#FBF5EA;display:grid;place-items:center;font-size:32px;margin:0 auto 10px;box-shadow:0 0 0 4px #D7AE5E}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cream);border-bottom:1px solid var(--line)}
.backbtn{min-height:48px;border-radius:24px;border:2px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;gap:4px;padding:0 14px 0 8px;font-weight:600;font-size:16px;cursor:pointer}
.backbtn svg{width:22px;height:22px}
.bar-title{font-family:var(--display);font-weight:700;font-size:23px}
.blank{min-height:60vh}

.scrim{position:fixed;inset:0;background:rgba(10,25,19,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet>*+*{margin-top:12px}
.grab{width:46px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;word-break:break-word}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;width:480px;max-width:92%;box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:16px}
/* Whole-picture viewer (replaces the round lens) */
.lens{width:100%;max-width:520px;aspect-ratio:auto;border-radius:24px;margin:16px auto 22px;min-height:0;
  box-shadow:0 0 0 5px #FBF5EA,0 0 0 8px #D7AE5E,0 0 0 10px #FBF5EA,0 0 0 11.5px #E3D5BA,0 18px 34px rgba(14,59,46,.22)}
.lens img,.lens.live video{width:100%;height:auto;max-height:70vh;object-fit:contain;display:block;background:#0B1A14}
.lens-empty{position:relative;inset:auto;min-height:250px;padding:30px 20px}
.lens-badge{left:12px;top:12px;bottom:auto;transform:none}
.live-tag{left:auto;right:12px;top:12px;transform:none}
.lens.sm{width:96px;border-radius:14px;box-shadow:0 0 0 3px #FBF5EA,0 0 0 5px #D7AE5E}
.lens.sm img{height:72px;max-height:none;object-fit:cover}
.lens.sm .lens-badge{left:4px;top:4px}

/* ---------- responsive: phone first, then tablet / big screen ---------- */
.n-warn{background:#FFF0D2;color:#7A4700}
.scan-col>*+*{margin-top:16px}
.pt-grid>*+*{margin-top:16px}
@media (min-width:820px){
  #app{max-width:1180px}
  .wrap{padding:28px 32px 48px}
  .bar{padding:14px 32px}
  .grid{grid-template-columns:repeat(4,1fr);gap:16px}
  .tile{min-height:150px}
  .hero-act{padding:30px 32px}
  .hero-act .t{font-size:42px}
  .hello h1{font-size:54px}
  .homehead{padding:24px 32px 28px}
  .scan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .scan-col:first-child{position:sticky;top:90px}
  .mapsvg{max-height:44vh}
  .lens{max-width:none;margin-top:0}
  .lens img,.lens.live video{max-height:62vh}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ls={get(k,d=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);

/* ---------- auth providers (same interface) ---------- */
const SupabaseAuth={
  label:"supabase",
  client:null,
  available(){ return !!(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey && window.supabase); },
  init(){ this.client=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true}}); },
  toUser(u){ return u?{id:u.id,email:u.email,name:(u.user_metadata&&u.user_metadata.name)||"",salon:(u.user_metadata&&u.user_metadata.salon)||"",verified:!!u.email_confirmed_at}:null; },
  async current(){ const {data}=await this.client.auth.getSession(); return this.toUser(data.session&&data.session.user); },
  async signUp({name,salon,email,password}){
    const {data,error}=await this.client.auth.signUp({email,password,options:{data:{name,salon},emailRedirectTo:SUPABASE_CONFIG.redirectTo||undefined}});
    if(error) throw mapErr(error.message);
    return {user:this.toUser(data.user), needsConfirm:!data.session};
  },
  async signIn({email,password}){ const {data,error}=await this.client.auth.signInWithPassword({email,password}); if(error) throw mapErr(error.message); return this.toUser(data.user); },
  async resetPassword(email){ const {error}=await this.client.auth.resetPasswordForEmail(email,{redirectTo:SUPABASE_CONFIG.redirectTo||undefined}); if(error) throw mapErr(error.message); },
  async resendConfirm(email){ const {error}=await this.client.auth.resend({type:"signup",email}); if(error) throw mapErr(error.message); },
  async signOut(){ await this.client.auth.signOut(); },
  /* Apple requires in-app account deletion. Deleting a user needs a server-side
     function (e.g. a Supabase Edge Function "delete-account") that uses the
     service key on the server — never in the app. */
  async deleteAccount(){ const {error}=await this.client.functions.invoke("delete-account"); if(error) throw new Error("delete_failed"); await this.client.auth.signOut(); }

/* Preview sign-in: accounts live in this browser only. Passwords are never
   stored — only a salted PBKDF2 hash. Emails can't be sent from a preview. */
const PreviewAuth={
  label:"preview",
  KEY:"crownologist.preview.accounts.v1", SESSION:"crownologist.preview.session.v1",
  available(){ return true; }, init(){},
  accounts(){ return ls.get(this.KEY,{}); },
  async hash(password,salt){
    const enc=new TextEncoder(); const key=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:150000,hash:"SHA-256"},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
  },
  async current(){ const s=ls.get(this.SESSION); if(!s) return null; const a=this.accounts()[s]; return a?{id:a.id,email:s,name:a.name,salon:a.salon,verified:false}:null; },
  async signUp({name,salon,email,password}){
    await wait(500); const all=this.accounts(); if(all[email]) throw mapErr("already registered");
    const salt=crypto.getRandomValues(new Uint32Array(4)).join("-");
    all[email]={id:"pv_"+Date.now().toString(36),name,salon,salt,hash:await this.hash(password,salt),createdAt:new Date().toISOString()};
    ls.set(this.KEY,all); ls.set(this.SESSION,email); return {user:await this.current(),needsConfirm:false};
  },
  async signIn({email,password}){ await wait(400); const a=this.accounts()[email]; if(!a||a.hash!==await this.hash(password,a.salt)) throw mapErr("invalid login credentials"); ls.set(this.SESSION,email); return this.current(); },
  async resetPassword(){ await wait(300); throw {code:"preview_email"}; },
  async resendConfirm(){ throw {code:"preview_email"}; },
  async signOut(){ ls.set(this.SESSION,null); },
  async deleteAccount(){ const s=ls.get(this.SESSION); const all=this.accounts(); delete all[s]; ls.set(this.KEY,all); ls.set(this.SESSION,null); }
};
function mapErr(msg){
  const m=String(msg||"").toLowerCase();
  if(m.includes("already")) return {code:"exists"};
  if(m.includes("invalid login")||m.includes("invalid credentials")) return {code:"bad_login"};
  if(m.includes("not confirmed")) return {code:"unconfirmed"};
  if(m.includes("rate")||m.includes("too many")) return {code:"rate"};
  if(m.includes("password")) return {code:"weak"};
  return {code:"network"};
}

/* =====================================================================
   AI ANALYSIS
   Describes what is visible in an uploaded scalp image, in plain
   cosmetic language. It never diagnoses, names conditions, recommends
   treatment or predicts growth. The hairdresser reviews every result.

   Inside Claude it uses the viewer's Claude access (`sample`). In the
   App Store version, swap AnalysisService.provider for a call to your
   own server, which holds the AI key — never put an AI key in the app.
   Categories and wording can be replaced with the Academy's own later
   by editing ANALYSIS_PROMPT.
   ===================================================================== */
const ANALYSIS_PROMPT = (type,note)=>`You are assisting a licensed hairdresser trained by Crown.ologist Academy. You are looking at one ${type==="scope"?"close-up image from a handheld scalp scope (magnified scalp and hair)":"phone photo of a client's scalp and hair"}.
${note?`The hairdresser added this context: """${note.slice(0,500)}"""\n`:""}
Describe ONLY what is visible, in plain, kind, cosmetic language a hairdresser can share with a client.
Rules:
- Do NOT diagnose. Do NOT name any medical condition or disease (for example: alopecia, psoriasis, dermatitis, eczema, folliculitis, fungal infection, telogen effluvium). Use neutral visible descriptions instead (for example: flaking, buildup, areas that look red, scalp more visible, finer strands, broken strands, oiliness, dryness).
- Do NOT recommend treatments, medications, supplements or products. Do NOT predict hair growth or results.
- If you cannot tell something from the image, say so rather than guessing.
- Suggest seeing a qualified clinician (doctor or dermatologist) only if you see something like open sores, bleeding, crusting, pus, swelling, lumps, an unusual mole, intense redness, or smooth patches with no hair. Describe what you see, without naming a condition.
- If the image is not of a scalp or hair, set "notScalp" to true and leave the lists empty.
- Keep each detail under 25 words.

Reply with ONLY this JSON, no other text:
{"notScalp":false,
 "quality":{"rating":"good"|"fair"|"poor","note":"one short sentence about focus, lighting or framing, with a tip if it should be retaken"},
 "observations":[{"title":"2-4 words","detail":"what is visible and where in the image"}],
 "watch":["things worth checking again at the next visit"],
 "refer":{"suggested":true|false,"reason":"what was seen, in plain words, or empty"},
 "clientSummary":"2 short, warm sentences the hairdresser could say to the client, with no diagnosis"}
Give 2 to 5 observations.`;

const AnalysisService={
  sample:null, limits:null, checked:false,
  async check(force){
    if(this.checked&&!force) return;
    try{
      if(window.claude&&window.claude.use){
        const t=new Promise(r=>setTimeout(()=>r(null),15000));
        this.sample=await Promise.race([claude.use("sample"),t]);
        if(this.sample) this.limits=await this.sample.limits().catch(()=>null);
      }
    }catch(e){ this.sample=null; }
    this.checked=true;
  },
  /* Only "can we ask Claude" gates the screen; whether images are allowed is
     answered by the call itself (images_unavailable), so a missing limits
     reply never hides the feature. */
  available(){ return !!this.sample; },
  maxImages(){ return (this.limits&&this.limits.images&&this.limits.images.maxCount)||7; },
  async run(blob,type,note,signal){
    const out=await this.sample.json(ANALYSIS_PROMPT(type,note),{images:[blob],signal,modelTier:"default",cache:false});
    return normalizeResult(out);
  }
};
function normalizeResult(r){
  r=r&&typeof r==="object"?r:{};
  const str=v=>typeof v==="string"?v.trim():"";
  const rating=["good","fair","poor"].includes(r.quality&&r.quality.rating)?r.quality.rating:"fair";
  return {
    notScalp:!!r.notScalp,
    quality:{rating,note:str(r.quality&&r.quality.note)},
    observations:(Array.isArray(r.observations)?r.observations:[]).map(o=>({title:str(o&&o.title),detail:str(o&&o.detail)})).filter(o=>o.title||o.detail).slice(0,6),
    watch:(Array.isArray(r.watch)?r.watch:[]).map(str).filter(Boolean).slice(0,5),
    refer:{suggested:!!(r.refer&&r.refer.suggested),reason:str(r.refer&&r.refer.reason)},
    clientSummary:str(r.clientSummary)
  };
}
async function prepImage(file){
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file);});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("bad_image"));i.src=url;});
  const max=1568, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const limit=(AnalysisService.limits&&AnalysisService.limits.images&&AnalysisService.limits.images.maxInputBytes)||4500000;
  for(let q=.88;q>=.5;q-=.1){ const b=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); if(b&&b.size<=limit) return {blob:b,preview:URL.createObjectURL(b)}; }
  throw new Error("too_large");
}

  not_granted:["AI analysis needs your permission","Allow it when asked, then try again."],
  images_unavailable:["Image analysis isn’t available here","Open the app in Claude on your phone or computer."],
  image_rejected:["That image couldn’t be read","Try a JPEG or PNG photo."],

   CLIENTS + EMAIL
   Clients and their saved analyses belong to the signed-in hairdresser.

const ClientStore={
  key(){ return "crownologist.clients.v1:"+(S.user?S.user.id:"none"); },
  all(){ return ls.get(this.key(),[]); },
  save(list){ try{ localStorage.setItem(this.key(),JSON.stringify(list)); return true; }catch(e){ return false; } },
  get(id){ return this.all().find(c=>c.id===id)||null; },
  upsert(c){ const l=this.all(); const i=l.findIndex(x=>x.id===c.id); if(i>=0) l[i]=c; else l.push(c); if(!this.save(l)) throw new Error("storage_full"); return c; },
  remove(id){ this.save(this.all().filter(c=>c.id!==id)); }
};

async function thumb(blob,size=520){
  const url=URL.createObjectURL(blob); const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url;});
  const sc=Math.min(1,size/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas");
  c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url); return c.toDataURL("image/jpeg",.72);
}

function updateAnalysis(fn){ const c=ClientStore.get(CL.clientId); const a=c.analyses.find(x=>x.id===CL.analysisId); fn(a,c); c.updatedAt=new Date().toISOString(); ClientStore.upsert(c); return a; }

  go_clients(){ go("clients"); }, go_client(){ go("client"); }, go_analysis(){ go("analysis"); },
  clientNew(){ CL.editing=null; CL.pickForAi=false; CL.form={name:"",email:"",phone:""}; CL.err={}; go("clientForm"); setTimeout(()=>{const n=$("#c_name"); if(n) n.focus();},50); },
  clientOpen(el){ CL.clientId=el.dataset.id; go("client"); },
  clientEdit(){ const c=ClientStore.get(CL.clientId); CL.editing=c.id; CL.form={name:c.name,email:c.email||"",phone:c.phone||""}; CL.err={}; go("clientForm"); },
  clientFormBack(){ if(CL.pickForScan){ CL.pickForScan=false; return go("scan"); } if(CL.pickForAi){ CL.pickForAi=false; go("ai"); } else if(CL.editing) go("client"); else go("clients"); },
  clientDelete(){ if(!confirm("Delete this client and their saved analyses? This can’t be undone.")) return; ClientStore.remove(CL.editing); CL.editing=null; toast("ok","Client deleted",""); go("clients"); },
  aiForClient(){ AI.clientId=CL.clientId; A.aiReset(true); go("ai"); if(!AnalysisService.checked) AnalysisService.check().then(()=>{ if(S.screen==="ai") render(); }); },
  aiPickClient(el){ AI.clientId=el.value||null; render(); },
  aiAddClient(){ CL.editing=null; CL.pickForAi=true; CL.form={name:"",email:"",phone:""}; CL.err={}; go("clientForm"); },
  analysisOpen(el){ CL.analysisId=el.dataset.id; go("analysis"); },
  emailCompose(){ const c=ClientStore.get(CL.clientId), a=curAnalysis(); CL.draft=emailDraft(c,a); CL.opened=false; CL.fallback=false; CL.sending=false; CL.sendErr=false; CL.sentAt=null; go("email"); },
  emailFromResult(){ CL.clientId=AI.clientId; CL.analysisId=AI.savedId; A.emailCompose(); },
  toggleRefer(){ updateAnalysis(a=>{ a.includeRefer=a.includeRefer===false; }); const c=ClientStore.get(CL.clientId); const to=CL.draft.to, sub=CL.draft.subject; CL.draft=emailDraft(c,curAnalysis()); CL.draft.to=to; CL.draft.subject=sub; render(); },
  emailOpen(el,e){ if(el.getAttribute("aria-disabled")==="true"){ e.preventDefault(); toast("bad","Add a valid email first",""); return; }
    const c=ClientStore.get(CL.clientId); if(normEmail(CL.draft.to)&&!c.email){ c.email=normEmail(CL.draft.to); ClientStore.upsert(c); }

document.addEventListener("input",e=>{
  const b=e.target.dataset.bindCl; if(b){ if(b==="query"){ CL.query=e.target.value; const pos=e.target.selectionStart; render(); const q=$("#cq"); if(q){ q.focus(); q.setSelectionRange(pos,pos);} return; } CL.form[b]=e.target.value; return; }
  const m=e.target.dataset.bindEm; if(m){ CL.draft[m]=e.target.value; const a=document.querySelector("[data-act=emailOpen]"); if(a&&m!=="body"&&m!=="subject"){ render(); const n=$("#e_to"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length);} } else if(a&&validEmail(normEmail(CL.draft.to))) a.href=EmailService.mailto(CL.draft); }
});
document.addEventListener("change",e=>{ if(e.target.id==="aiClient"){ AI.clientId=e.target.value||null; if(e.target.value==="__new") { AI.clientId=null; A.aiAddClient(); } else render(); } });
document.addEventListener("submit",e=>{
  if(!e.target.dataset.clForm) return; e.preventDefault();
  const f=CL.form, err={}; f.email=normEmail(f.email);
  if(!f.name.trim()) err.name="Add the client’s name.";
  if(!f.email) err.email="Add an email so you can send results."; else if(!validEmail(f.email)) err.email="Check the email address.";
  CL.err=err; if(Object.keys(err).length){ render(); const k=Object.keys(err)[0]; const el=$("#c_"+k); if(el) el.focus(); return; }
  const now=new Date().toISOString(); const prev=CL.editing?ClientStore.get(CL.editing):null;
  const c={...(prev||{id:newId("c_"),createdAt:now,analyses:[]}),name:f.name.trim(),email:f.email,phone:f.phone.trim(),updatedAt:now};
  try{ ClientStore.upsert(c); }catch(x){ toast("bad","Client not saved","This device is out of space."); return; }
  toast("ok",CL.editing?"Changes saved":"Client saved","");
  if(CL.pickForScan){ CL.pickForScan=false; SC.clientId=c.id; if(SC.state==="done") saveScanToClient().then(()=>go("scan")); else go("scan"); }
  else if(CL.pickForAi){ CL.pickForAi=false; AI.clientId=c.id; if(AI.state==="done") saveAnalysisToClient().then(()=>go("ai")); else go("ai"); } else { CL.clientId=c.id; CL.editing=null; go("client"); }
});

function partSVG(x,y,ang,len=96){
  const h=len/2;
  return `<g transform="rotate(${ang-90} ${x} ${y})">
    <rect x="${x-12}" y="${y-h-4}" width="24" height="${len+8}" rx="12" fill="#3B2A1C" opacity=".22" filter="url(#partBlur)"/>

    <path d="M${x} ${y-h} V${y+h}" stroke="#F0C6A6" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M${x} ${y-h} V${y+h}" stroke="#E2A988" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
    ${[-1,1].map(sd=>`<g transform="rotate(${sd*28} ${x+sd*12} ${y-h+6})"><rect x="${x+sd*12-11}" y="${y-h+3}" width="22" height="6" rx="3" fill="#D7AE5E" stroke="#9C7426" stroke-width="1"/><rect x="${x+sd*12-8}" y="${y-h+4.6}" width="14" height="1.6" rx=".8" fill="#F6E3A8"/></g>`).join("")}

  return `<g filter="url(#mShadow)">${state==="cur"?`<circle class="mpulse" cx="${x}" cy="${y}" r="${r+5}" fill="none" stroke="#D7AE5E" stroke-width="4"/>`:""}
    <circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${state==="done"?"#D7AE5E":"#fff"}" stroke-width="3.5"/>

function target7(x,y,cur){ const r=26; return `<g filter="url(#mShadow)"><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#C8124F" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M${x} ${y-r-10}v9M${x} ${y+r+1}v9M${x-r-10} ${y}h9M${x+r+1} ${y}h9" stroke="#C8124F" stroke-width="3" stroke-linecap="round"/>${marker(7,x,y,cur?"cur":SC.shots.P07?"done":"todo").replace('<g filter="url(#mShadow)">',"<g>")}</g>`; }

  const V=VIEWS[view];

  const loc=p7||SC.p7; if(loc&&loc.view===view&&loc.v===2) marks+=target7(loc.x,loc.y,cur===7);

function regionText(l){

async function runScan(signal){
  const per=Math.max(1,Math.min(7,AnalysisService.maxImages()));
  const groups=[]; for(let i=0;i<7;i+=per) groups.push(MPOINTS.slice(i,i+per));
  const points=[]; let overall=null;
  for(let g=0;g<groups.length;g++){
    const pts=groups[g]; SC.progress=groups.length>1?`Looking at points ${pts[0].n}–${pts[pts.length-1].n} of 7`:"Looking at all 7 points"; render();
    const one=groups.length===1;
    const out=await AnalysisService.sample.json(scanPrompt(pts,one,""),{images:pts.map(p=>SC.shots[p.id].blob),signal,modelTier:"default",cache:false});
    const arr=Array.isArray(out&&out.points)?out.points:[];
    pts.forEach((p,i)=>{ const hit=arr.find(x=>x&&+x.n===p.n)||arr[i]; points.push(normPoint(hit,p.n)); });
    if(one) overall=normOverall(out&&out.overall);
  }
  if(!overall){ SC.progress="Putting the full picture together"; render();
    overall=normOverall(await AnalysisService.sample.json(summaryPrompt(points),{signal,modelTier:"default",cache:false})); }
  if(!overall.refer.suggested && points.some(p=>p.refer.suggested)){ const p=points.find(x=>x.refer.suggested); overall.refer={suggested:true,reason:`Point ${p.n}: ${p.refer.reason}`}; }
  return {kind:"scan",points,overall,p7desc:SC.p7desc.trim(),p7:SC.p7,p7region:regionText(SC.p7)};
}

   LIVE CAMERA (phone photos)
   Opens the phone's camera inside the round lens so each point is taken
   in the app. If the browser or Claude viewer blocks camera access, the
   app falls back to the phone's camera app.
   Scope photos can't stream into this version (the scope's Wi-Fi video
   needs the App Store version), so scope mode still uses Photos.
   ===================================================================== */
const Cam={stream:null,facing:"environment",
  supported(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia); },
  async start(){
    if(!this.supported()) throw {code:"cam_unsupported"};
    this.stop();
    try{ this.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:this.facing},width:{ideal:1920},height:{ideal:1920}}}); }
    catch(e){ throw {code:e&&e.name==="NotAllowedError"?"cam_blocked":e&&e.name==="NotFoundError"?"cam_none":"cam_failed"}; }
  },
  videoEl:null,
  stop(){ if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; } this.videoEl=null; },
  /* Re-renders replace the page, so the playing video element is moved into
     the new spot instead of restarting — no flicker between points. */
  attach(){ const ph=document.getElementById("camVideo"); if(!ph){ this.stop(); return; }
    if(this.videoEl&&this.videoEl!==ph&&this.videoEl.srcObject===this.stream){ this.videoEl.style.transform=ph.style.transform; ph.replaceWith(this.videoEl); return; }
    this.videoEl=ph; if(this.stream&&ph.srcObject!==this.stream){ ph.srcObject=this.stream; ph.play().catch(()=>{}); } },
  async snap(){
    const v=document.getElementById("camVideo"); if(!v||!v.videoWidth) throw {code:"cam_failed"};
    const s=Math.min(v.videoWidth,v.videoHeight), sx=(v.videoWidth-s)/2, sy=(v.videoHeight-s)/2, out=Math.min(1400,s);
    const c=document.createElement("canvas"); c.width=c.height=out; const g=c.getContext("2d");
    if(this.facing==="user"){ g.translate(out,0); g.scale(-1,1); }
    g.drawImage(v,sx,sy,s,s,0,0,out,out);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
  }
};
const CAM_ERR={
  cam_blocked:["Camera access is blocked here","Allow camera access when asked, or use your phone’s camera app below."],
  cam_unsupported:["The live camera isn’t available in this view","Use your phone’s camera app below. In Safari the live camera may work."],
  cam_none:["No camera found","Use Photos instead."],
  cam_failed:["The camera didn’t start","Try again, or use your phone’s camera app below."]
};
function camErrBox(code){ if(!code) return ""; const [t,m]=CAM_ERR[code]||CAM_ERR.cam_failed; return `<div class="notice n-bad" role="alert" style="margin:0"><b>${t}</b>${m}</div>`; }
function liveLens(n,label){ return `<div class="lens live"><video id="camVideo" playsinline muted autoplay ${Cam.facing==="user"?'style="transform:scaleX(-1)"':""}></video>
  <svg class="reticle" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="16" fill="none" stroke="#fff" stroke-width=".6" stroke-dasharray="2 2" opacity=".8"/><path d="M50 30v8M50 62v8M30 50h8M62 50h8" stroke="#fff" stroke-width=".8" opacity=".85"/></svg>
  <span class="live-tag">● LIVE</span><span class="lens-badge">${n}</span></div>`; }
/* Phone-mode capture block shared by both analyses */
function phoneCapture(ctx){ // ctx: {on, err, has, preview, n, alt, label, act}
  if(ctx.on) return `${liveLens(ctx.n,ctx.label)}
    <button class="shutter" data-act="${ctx.act}Snap" aria-label="Take ${ctx.label}"><span></span></button>
    <div class="row2"><button class="btn btn-ghost" data-act="camFlip">Flip camera</button><button class="btn btn-ghost" data-act="${ctx.act}CamOff">Close camera</button></div>`;
  return `${lens(ctx.preview,ctx.n,ctx.alt,ctx.label)}
    ${camErrBox(ctx.err)}
    ${ctx.err?`<div class="row2"><button class="btn btn-pink" data-act="${ctx.act}Pick" data-src="cam">Phone camera app</button><button class="btn btn-ghost" data-act="${ctx.act}Pick" data-src="lib">Photos</button></div>`
      :`<div class="row2"><button class="btn btn-pink" data-act="${ctx.act}CamOn">${ctx.has?"Retake in app":"Open camera"}</button><button class="btn btn-ghost" data-act="${ctx.act}Pick" data-src="lib">Photos</button></div>`}`;
}
const _renderBase=render;
render=function(){ _renderBase(); Cam.attach(); };
Object.assign(A,{
  async camFlip(){ Cam.facing=Cam.facing==="environment"?"user":"environment"; try{ await Cam.start(); Cam.videoEl=null; render(); }catch(e){ toast("bad","Couldn’t switch camera",""); } },
  async scanCamOn(){ SC.camErr=null; try{ await Cam.start(); Cam.videoEl=null; SC.cam=true; }catch(e){ SC.cam=false; SC.camErr=e.code; } render(); },
  scanCamOff(){ SC.cam=false; Cam.stop(); render(); },
  async scanSnap(){ const p=MPOINTS[SC.idx];
    try{ const blob=await Cam.snap(); const r=await prepImage(blob); if(SC.shots[p.id]) URL.revokeObjectURL(SC.shots[p.id].preview); SC.shots[p.id]=r;
      announce(`Point ${p.n} captured`);
      const next=MPOINTS.findIndex((q,i)=>i>SC.idx&&!SC.shots[q.id]); if(next>=0) SC.idx=next; else { SC.cam=false; Cam.stop(); }
      render(); }
    catch(e){ toast("bad","Photo not taken","Try again."); } },
  async aiCamOn(){ AI.camErr=null; try{ await Cam.start(); Cam.videoEl=null; AI.cam=true; }catch(e){ AI.cam=false; AI.camErr=e.code; } render(); },
  aiCamOff(){ AI.cam=false; Cam.stop(); render(); },
  async aiSnap(){ try{ const blob=await Cam.snap(); const r=await prepImage(blob); if(AI.preview) URL.revokeObjectURL(AI.preview); AI.blob=r.blob; AI.preview=r.preview; AI.cam=false; Cam.stop(); AI.state="idle"; AI.result=null; render(); announce("Photo taken"); }
    catch(e){ toast("bad","Photo not taken","Try again."); } }
});
/* Full-frame snapshot: keep the whole picture, no square crop. */
Cam.snap=async function(){
  const v=document.getElementById("camVideo"); if(!v||!v.videoWidth) throw {code:"cam_failed"};
  const w=v.videoWidth, h=v.videoHeight, sc=Math.min(1,1600/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*sc); c.height=Math.round(h*sc); const g=c.getContext("2d");
  if(this.facing==="user"){ g.translate(c.width,0); g.scale(-1,1); }
  g.drawImage(v,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
};

/* =====================================================================
   SCOPE CONNECTION (HT-BW36)
   Every HT-BW36 works the same way: it makes its own Wi-Fi network named
   "HTBW36-" plus a code unique to that scope (yours: HTBW36-75e5fb), and the
   scope always sits at 192.168.166.1 (the phone gets 192.168.166.2). Only the
   network name changes from scope to scope.

   Still unknown: the live-video port/path and the capture-button signal.
   Fill in SCOPE_CONFIG.streamPath once it's confirmed (Safari test,
   manufacturer, or developer). Candidate paths are tried in order.

   This works in the App Store version only. Pages inside Claude can't reach
   devices on local Wi-Fi, so here the test reports that honestly. The App
   Store build needs iOS Local Network permission and an App Transport
   Security exception for 192.168.166.1. Capturing frames from the stream
   and listening for the scope's button need a small native plugin.
   ===================================================================== */
const SCOPE_CONFIG={
  model:"HT-BW36",
  ssidPrefix:"HTBW36-",
  host:"192.168.166.1",
  phoneIp:"192.168.166.2",
  format:"M-JPEG over Wi-Fi",
  streamPath:"",                       // confirmed path goes here, e.g. ":8080/?action=stream"
  candidates:[":8080/?action=stream",":8080/stream",":81/stream","/"],
  buttonSignal:null                    // to be confirmed: how the capture button notifies the app
};
const SCOPE_KEY="crownologist.scope.v1";
const ScopeLink={
  saved(){ return Object.assign({ssid:"HTBW36-75e5fb",path:SCOPE_CONFIG.streamPath},ls.get(SCOPE_KEY,{})); },
  save(v){ ls.set(SCOPE_KEY,Object.assign(this.saved(),v)); },
  url(p){ return "http://"+SCOPE_CONFIG.host+(p||""); },
  /* Native builds set window.CROWN_NATIVE=true; only then is a live link attempted. */
  canConnectHere(){ return !!window.CROWN_NATIVE; },
  test(path){ return new Promise(res=>{ const img=new Image(); let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; img.src=""; res(false); } },4000);
    img.onload=()=>{ if(!done){ done=true; clearTimeout(t); res(true); } };
    img.onerror=()=>{ if(!done){ done=true; clearTimeout(t); res(false); } };
    img.src=this.url(path)+(path.includes("?")?"&":"?")+"t="+Date.now(); }); }
};
const SL={state:"idle",found:null};
function scopePage(){
  const cfg=ScopeLink.saved(), native=ScopeLink.canConnectHere();
  const status = SL.state==="testing"?`<div class="notice n-info" role="status"><b>Looking for your scope…</b>Checking ${esc(SCOPE_CONFIG.host)}.</div>`
    : SL.state==="found"?`<div class="notice n-ok"><b>Scope found</b>Live view is coming through ${esc(SL.found)}.</div>`
    : SL.state==="notfound"?`<div class="notice n-bad"><b>Couldn’t reach the scope</b>Make sure you’re on its Wi-Fi and the scope is on, then try again.</div>`
    : !native?`<div class="notice n-info"><b>Live scope connection is ready for the App Store version</b>This preview can’t connect to devices on Wi-Fi, so add scope photos from Photos for now.</div>`:"";
  return bar("Scope")+`<main class="wrap" id="main">
    ${status}
    <div class="rcard"><h3>Connect your ${esc(SCOPE_CONFIG.model)}</h3>
      <ol class="bul" style="margin-top:8px"><li>Turn the scope on.</li><li>Open <b>Settings</b>, then <b>Wi-Fi</b>, and join the network that starts with <b>${esc(SCOPE_CONFIG.ssidPrefix)}</b>.</li><li>Close the HotMac app so it isn’t using the scope.</li><li>Come back and tap <b>Connect scope</b>.</li></ol>
      <button class="btn btn-pink" data-act="scopeTest" ${SL.state==="testing"?"disabled":""}>${SL.state==="testing"?'<span class="spin"></span>Connecting':"Connect scope"}</button></div>
    <div class="rcard"><h3>Your scope’s details</h3>
      <dl class="kv"><dt>Model</dt><dd>${esc(SCOPE_CONFIG.model)}</dd><dt>Wi-Fi name</dt><dd>${esc(cfg.ssid)}</dd><dt>Scope address</dt><dd>${esc(SCOPE_CONFIG.host)}</dd><dt>Phone address</dt><dd>${esc(SCOPE_CONFIG.phoneIp)}</dd><dt>Video</dt><dd>${esc(SCOPE_CONFIG.format)}</dd><dt>Video path</dt><dd>${cfg.path?esc(cfg.path):"Not confirmed yet"}</dd><dt>Capture button</dt><dd>${SCOPE_CONFIG.buttonSignal?"Supported":"Not confirmed yet"}</dd></dl>
      <div class="field" style="margin:12px 0 0"><label for="sc_ssid">Wi-Fi name on this scope</label><input id="sc_ssid" class="input" value="${esc(cfg.ssid)}" data-bind-scope="ssid" autocapitalize="off" spellcheck="false"><div class="hint">Every HT-BW36 starts with ${esc(SCOPE_CONFIG.ssidPrefix)} and has its own code after it. The address is the same on all of them.</div></div>
      <div class="field" style="margin:12px 0 0"><label for="sc_path">Video path <span class="opt">(once confirmed)</span></label><input id="sc_path" class="input" value="${esc(cfg.path)}" data-bind-scope="path" placeholder=":8080/?action=stream" autocapitalize="off" spellcheck="false"></div></div>
  </main>`;
}
Object.assign(SCREENS,{scope(){ return scopePage(); }});
Object.assign(A,{
  async scopeTest(){
    if(!ScopeLink.canConnectHere()){ SL.state="idle"; toast("info","Available in the App Store version","This preview can’t connect to Wi-Fi devices."); render(); return; }
    SL.state="testing"; render(); const cfg=ScopeLink.saved();
    const paths=[cfg.path,...SCOPE_CONFIG.candidates].filter((p,i,a)=>p!==undefined&&p!==null&&a.indexOf(p)===i&&p!=="");
    for(const p of paths){ if(await ScopeLink.test(p)){ SL.state="found"; SL.found=SCOPE_CONFIG.host+p; ScopeLink.save({path:p}); render(); return; } }
    SL.state="notfound"; render();
  }
});
document.addEventListener("input",e=>{ const k=e.target.dataset.bindScope; if(k) ScopeLink.save({[k]:e.target.value.trim()}); });

/* One-tap sending. In the App Store version set EmailService.send to either:
   A) the iPhone's built-in in-app mail sheet (free; sends from the
      hairdresser's own Mail account), via a Capacitor email plugin, or
   B) your server (e.g. a Supabase function calling Resend/Postmark) so it
      sends from your Academy address with no extra screen.
   It receives {to, subject, body, photos:[jpeg data URLs]} and resolves when sent. */
Object.assign(A,{
  async emailSend(el){
    if(el.getAttribute("aria-disabled")==="true"){ toast("bad","Add a valid email first",""); const n=$("#e_to"); if(n) n.focus(); return; }
    if(!EmailService.send){ CL.fallback=true; render(); return; }
    const c=ClientStore.get(CL.clientId), a=curAnalysis();
    const photos=a.kind==="scan"?MPOINTS.map(p=>a.thumbs&&a.thumbs[p.id]).filter(Boolean):(a.thumb?[a.thumb]:[]);
    CL.sending=true; CL.sendErr=false; render();
    try{ await EmailService.send({to:normEmail(CL.draft.to),subject:CL.draft.subject,body:CL.draft.body,photos});
      if(!c.email){ c.email=normEmail(CL.draft.to); ClientStore.upsert(c); }
      updateAnalysis(x=>{ x.emailedAt=new Date().toISOString(); x.emailedTo=normEmail(CL.draft.to); });
      CL.sending=false; CL.sentAt=new Date().toISOString(); render(); announce("Report sent"); }
    catch(e){ CL.sending=false; if(e&&e.code==='fallback'){ CL.fallback=true; CL.sendErr=false; } else CL.sendErr=true; render(); }
  }
});

/* After-analysis client picker: save a finished analysis to a client so it can be emailed. */
document.addEventListener("change",async e=>{
  if(e.target.id!=="scClientAfter") return;
  if(e.target.value==="__new"){ CL.editing=null; CL.pickForScan=true; CL.form={name:"",email:"",phone:""}; CL.err={}; go("clientForm"); return; }
  SC.clientId=e.target.value||null; if(SC.clientId){ await saveScanToClient(); toast("ok","Saved to client",""); } render();
});

/* ---------- boot ---------- */
(async()=>{
  render();
  if(SupabaseAuth.available()){ try{ SupabaseAuth.init(); Auth=SupabaseAuth; }catch(e){ Auth=PreviewAuth; } }
  try{ S.user=await Auth.current(); }catch(e){ S.user=null; }
  if(S.user) go("home"); else { S.mode=Object.keys(PreviewAuth.accounts()).length||Auth!==PreviewAuth?"signin":"signup"; go("auth"); }
})();
</script>
<script>
/* =====================================================================
   HOSTED VERSION (your own website on Vercel). No Claude account needed.
   - AI analysis goes to /api/analyze, which holds your Anthropic key.
   - Send report emails through /api/send-report when email is set up;
     if it isn't, the app offers "Open in my email app" instead.
   - An access code keeps anyone else from using your AI and email.
   ===================================================================== */
(function(){
  const CODE_KEY="crownologist.accesscode.v1";
  function code(){ let c=""; try{ c=localStorage.getItem(CODE_KEY)||""; }catch(e){}
    if(!c){ c=(window.prompt("Enter your Crown.ologist access code")||"").trim(); if(c){ try{ localStorage.setItem(CODE_KEY,c); }catch(e){} } }
    return c; }
  function forgetCode(){ try{ localStorage.removeItem(CODE_KEY); }catch(e){} }
  const toB64=blob=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });
  async function post(path,payload,signal){
    let resp;
    try{ resp=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","x-access-code":code()},body:JSON.stringify(payload),signal}); }
    catch(e){ if(e&&e.name==="AbortError") throw {code:"cancelled"}; throw {code:"other"}; }
    let data={}; try{ data=await resp.json(); }catch(e){}
    if(resp.status===401){ forgetCode(); throw {code:"bad_code"}; }
    if(!resp.ok) throw {code:data.code||"other"};
    return data;
  }
  const HOSTED_LIMITS={maxPromptBytes:200000,images:{maxCount:7,maxInputBytes:380000,mediaTypes:["image/jpeg","image/png","image/webp"]}};
  const HostedSample={
    async json(prompt,opts={}){
      const imgs=[]; for(const b of (opts.images||[])) imgs.push({media_type:b.type||"image/jpeg",data:await toB64(b)});
      const data=await post("/api/analyze",{prompt,images:imgs},opts.signal);
      if(!data.result||typeof data.result!=="object") throw {code:"invalid_json"};
      return data.result;
    },
    async limits(){ return HOSTED_LIMITS; }
  };
  AnalysisService.check=async function(){ this.sample=HostedSample; this.limits=HOSTED_LIMITS; this.checked=true; };
  AnalysisService.sample=HostedSample; AnalysisService.limits=HOSTED_LIMITS; AnalysisService.checked=true;
  EmailService.send=async function({to,subject,body,photos}){
    try{ await post("/api/send-report",{to,subject,body,photos:(photos||[]).slice(0,7)}); return true; }
    catch(e){ if(e&&e.code==="email_not_set_up") throw {code:"fallback"}; throw e; }
  };
  AI_ERR.bad_code=["That access code didn’t work","Tap Analyze again and enter the right code."];
  AI_ERR.server_not_set_up=["The AI isn’t set up yet","Add your Anthropic key in Vercel’s settings, then redeploy."];
})();

</script>
